version: "3.9"

services:
  db:
    image: postgres:16
    container_name: edtech_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: edtech
      POSTGRES_USER: edtech_user
      POSTGRES_PASSWORD: edtech_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: edtech_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_pass123
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data

  chroma:
    image: chromadb/chroma
    container_name: edtech_chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma

volumes:
  pgdata:
  miniodata:
  chromadata:
